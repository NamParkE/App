# DB 마이그레이션 자동 적용: main 에 supabase/migrations/ 파일이 바뀌어 올라오면 운영 DB(Supabase)에 새 파일만 적용한다.
# 필요한 것: 저장소 Secret SUPABASE_DB_URL (Supabase > Connect > Session pooler 연결 문자열, 비밀번호를 넣은 것)
# 손으로 SQL Editor 에 붙여 넣을 필요가 없다. 결과는 Actions 탭의 "DB migrate" 에서 본다.
name: DB migrate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

# 동시에 두 번 돌지 않게 (뒤에 온 것은 앞의 것이 끝날 때까지 기다린다)
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::저장소 Settings > Secrets and variables > Actions 에 SUPABASE_DB_URL 을 추가해 주세요 (Supabase > Connect > Session pooler)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply new migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./scripts/db-migrate.sh
