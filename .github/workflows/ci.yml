# 자동 검사: main 에 올라오는 모든 변경(그리고 PR)을 검사한다. 결과는 Actions 탭의 "CI" 에서 본다.
# - app: 타입 검사 · 단위 테스트 · 프로덕션 빌드
# - db : 빈 Postgres 에 마이그레이션 0001 부터 끝까지 적용하고, 차감 · 환불 · 스크립트 교체 · 운영자 권한 · 가족 경계를 테스트
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 단위 테스트
        run: npm test
      - name: 빌드
        env:
          # 빌드에는 실제 값이 필요 없다 (화면은 요청 때 Supabase 에 접속)
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: 마이그레이션 적용 + DB 테스트
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: ./scripts/db-test.sh
